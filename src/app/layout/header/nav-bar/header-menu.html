<dialog appDialog="menu" [modal]="false">
    <nav>
        <a
            class="help-btn"
            [routerLink]="['/help']"
            routerLinkActive="active"
            (click)="dialogservice.closeDialog()"
            >Help</a
        >
        <a
            [routerLink]="['/legal-notice']"
            routerLinkActive="active"
            (click)="dialogservice.closeDialog()"
            >Legal Notice</a
        >
        <a
            [routerLink]="['/privacy-policy']"
            routerLinkActive="active"
            (click)="dialogservice.closeDialog()"
            >Privacy Policy</a
        >
    
        <button type="button" (click)="logout()" [disabled]="isLoggingOut()">
            {{ isLoggingOut() ? 'Logging out…' : 'Logout' }}
        </button>
    </nav>
</dialog>
