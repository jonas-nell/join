<section class="login-form">
    <form (ngSubmit)="onSubmit()">
        <div>
            <label for="email">E-Mail-address:</label>

            <input
                type="email"
                id="email"
                [(ngModel)]="email"
                name="email"
                autocomplete="email"
                required
            />
        </div>

        <div>
            <label for="password">Password:</label>

            <input
                type="password"
                id="password"
                [(ngModel)]="password"
                name="password"
                autocomplete="current-password"
                required
            />
        </div>

        <button type="submit">Login</button>
    </form>
    <!-- <a routerLink="/signup-form" class="signup-button"> Signup </a> -->

    <button type="submit">Login</button>

    <button type="button" (click)="loginAsGuest()">Continue as guest</button>
</section>
