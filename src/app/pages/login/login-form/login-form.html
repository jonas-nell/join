<section class="login-form">
    <div class="header-form">
        <h1>Log in</h1>
        <div class="line"></div>
    </div>
    <form (ngSubmit)="onSubmit()">
        <div class="input-wrapper">
            <label for="email"></label>

            <div class="input-and-icon">
                <input
                    placeholder="Email"
                    type="email"
                    id="email"
                    [(ngModel)]="email"
                    name="email"
                    autocomplete="email"
                    required
                />
                <img src="./assets/icons/mail.png" alt="mail icon" />
            </div>
        </div>

        <div class="input-wrapper">
            <label for="password"></label>

            <div class="input-and-icon">
                <input
                    placeholder="Password"
                    type="password"
                    id="password"
                    [(ngModel)]="password"
                    name="password"
                    autocomplete="current-password"
                    required
                />
                <img src="./assets/icons/lock.png" alt="lock icon" />
            </div>
        </div>

        <div class="button-wrapper">
            <button class="btn-login" type="submit">Login</button>
            <button class="btn-guest" type="button">Guest Log in</button>
        </div>
    </form>
    <!-- <a routerLink="/signup-form" class="signup-button"> Signup </a> -->
</section>
