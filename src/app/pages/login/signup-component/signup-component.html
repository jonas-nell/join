<section class="signup-form">
    <form #signupForm="ngForm" (ngSubmit)="onSubmit()">
        <div>
            <label for="userName">Benutzername:</label>

            <input
                type="text"
                id="userName"
                name="userName"
                [(ngModel)]="userName"
                autocomplete="username"
                required
            />
        </div>

        <div>
            <label for="email">E-Mail-address:</label>

            <input
                type="email"
                id="email"
                name="email"
                [(ngModel)]="email"
                autocomplete="email"
                required
                email
            />
        </div>

        <div>
            <label for="password">Password:</label>

            <input
                type="password"
                id="password"
                name="password"
                [(ngModel)]="password"
                autocomplete="new-password"
                required
            />
        </div>

        <div>
            <label for="passwordConfirmation">Reapet password:</label>

            <input
                type="password"
                id="passwordConfirmation"
                name="passwordConfirmation"
                [(ngModel)]="passwordConfirmation"
                autocomplete="new-password"
                required
            />
        </div>

        @if (errorMessage) {
            <p class="message message--error" role="alert">
                {{ errorMessage }}
            </p>
        }

        @if (successMessage) {
            <p class="message message--success" role="status">
                {{ successMessage }}
            </p>
        }

        <button type="submit" [disabled]="signupForm.invalid || loading">
            {{ loading ? 'Account added…' : 'Register' }}
        </button>
    </form>
</section>
