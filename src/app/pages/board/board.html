<div class="board-wrapper">
    <div class="board-top">
        <h2>Board</h2>
        <app-search-bar></app-search-bar>
        <app-add-task-button></app-add-task-button>
    </div>
    <div class="board-main" cdkDropListGroup>
        <div class="task-container">
            <h3>to do</h3>
            <div
                cdkDropList
                [cdkDropListData]="todo"
                class="task-list"
                (cdkDropListDropped)="drop($event)"
            >
                @for (task of todo; track task) {
                    <div class="task" cdkDrag>
                        <div class="drag-placeholder" *cdkDragPlaceholder></div>
                        {{ task }}
                    </div>
                }
            </div>
        </div>

        <div class="task-container">
            <h3>In progress</h3>
            <div
                cdkDropList
                [cdkDropListData]="progress"
                class="task-list"
                (cdkDropListDropped)="drop($event)"
            >
                @for (task of progress; track task) {
                    <div class="task" cdkDrag>
                        <div class="drag-placeholder" *cdkDragPlaceholder></div>
                        {{ task }}
                    </div>
                }
            </div>
        </div>

        <div class="task-container">
            <h3>Await feedback</h3>
            <div
                cdkDropList
                [cdkDropListData]="feedback"
                class="task-list"
                (cdkDropListDropped)="drop($event)"
            >
                @for (task of feedback; track task) {
                    <div class="task" cdkDrag>
                        <div class="drag-placeholder" *cdkDragPlaceholder></div>
                        {{ task }}
                    </div>
                }
            </div>
        </div>

        <div class="task-container">
            <h3>done</h3>
            <div
                cdkDropList
                [cdkDropListData]="done"
                class="task-list"
                (cdkDropListDropped)="drop($event)"
            >
                @for (task of done; track task) {
                    <div class="task" cdkDrag>
                        <div class="drag-placeholder" *cdkDragPlaceholder></div>
                        {{ task }}
                    </div>
                }
            </div>
        </div>
    </div>
</div>
